name: Release

# Tagged release: pushing a tag manually builds all six binaries and
# publishes them to the GitHub release. Tags with a `-` suffix
# (e.g. `v0.2.0-beta.1`) publish as prereleases; plain `vX.Y.Z` tags
# publish as stable.
on:
  push:
    tags:
      - 'v*'

env:
  # Tagged builds report the clean Cargo.toml version (no commit hash).
  KODI_RPC_RELEASE: 1

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-linux

      - name: Build
        run: cargo build --workspace --locked --release

      - name: Rename binary
        run: mv target/release/kodi-rpc target/release/kodi-rpc-x86_64-linux

      - name: Run cargo test
        run: cargo test --all-features --locked

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/release/kodi-rpc-x86_64-linux

  ubuntu-arm32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Update apt and install ARM32 gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm32-linux

      - name: Build for ARM32 Linux
        run: cargo build --target armv7-unknown-linux-gnueabihf --workspace --locked --release
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc

      - name: Rename binary
        run: mv target/armv7-unknown-linux-gnueabihf/release/kodi-rpc target/armv7-unknown-linux-gnueabihf/release/kodi-rpc-arm32-linux

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/armv7-unknown-linux-gnueabihf/release/kodi-rpc-arm32-linux

  ubuntu-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Update apt and install ARM64 gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64-linux

      - name: Build for ARM64 Linux
        run: cargo build --target aarch64-unknown-linux-gnu --workspace --locked --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary
        run: mv target/aarch64-unknown-linux-gnu/release/kodi-rpc target/aarch64-unknown-linux-gnu/release/kodi-rpc-arm64-linux

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/aarch64-unknown-linux-gnu/release/kodi-rpc-arm64-linux

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-windows

      - name: Build
        run: cargo build --workspace --locked --release

      - name: Run cargo test
        run: cargo test --all-features --locked

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: target/release/kodi-rpc.exe

  macos-x86_64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-macos

      - name: Build for x86_64 macOS
        run: cargo build --target x86_64-apple-darwin --workspace --locked --release

      - name: Rename binary
        run: mv target/x86_64-apple-darwin/release/kodi-rpc target/x86_64-apple-darwin/release/kodi-rpc-x86_64-darwin

      - name: Run cargo test
        run: cargo test --all-features --locked

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/x86_64-apple-darwin/release/kodi-rpc-x86_64-darwin

  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64-macos

      - name: Build for arm64 macOS
        run: cargo build --target aarch64-apple-darwin --workspace --locked --release

      - name: Rename binary
        run: mv target/aarch64-apple-darwin/release/kodi-rpc target/aarch64-apple-darwin/release/kodi-rpc-arm64-darwin

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/aarch64-apple-darwin/release/kodi-rpc-arm64-darwin
