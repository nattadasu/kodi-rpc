      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/x86_64-apple-darwin/release/kodi-rpc-x86_64-darwin

  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
